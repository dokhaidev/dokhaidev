      <circle cx="120" cy="116" r="22" fill="#0B1226" stroke="#25324A" stroke-width="2"/>
      <circle cx="120" cy="116" r="29" fill="none" stroke="#22D3EE" stroke-opacity=".35" stroke-dasharray="3 5"/>
      <circle cx="120" cy="116" r="22" fill="none" stroke="#22D3EE" stroke-width="2" opacity="0"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.1;1" dur="7s" repeatCount="indefinite"/></circle>
      <text x="120" y="121" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#22D3EE" text-anchor="middle">01</text>
      <text x="120" y="178" font-size="18" font-weight="700" fill="#E2E8F0" text-anchor="middle">Research</text>
      <text x="120" y="202" font-size="13" fill="#94A3B8" text-anchor="middle">hiểu người dùng</text>
    </g><g class="up" style="animation-delay:0.2s">
      <circle cx="312" cy="116" r="30" fill="#38BDF8" opacity="0" filter="url(#blur2)"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.140;0.160;0.260;1" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="312" cy="116" r="22" fill="#0B1226" stroke="#25324A" stroke-width="2"/>
      <circle cx="312" cy="116" r="29" fill="none" stroke="#38BDF8" stroke-opacity=".35" stroke-dasharray="3 5"/>
      <circle cx="312" cy="116" r="22" fill="none" stroke="#38BDF8" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.140;0.160;0.260;1" dur="7s" repeatCount="indefinite"/></circle>
      <text x="312" y="121" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#38BDF8" text-anchor="middle">02</text>
      <text x="312" y="178" font-size="18" font-weight="700" fill="#E2E8F0" text-anchor="middle">Design</text>
      <text x="312" y="202" font-size="13" fill="#94A3B8" text-anchor="middle">Figma, wireframe</text>
    </g><g class="up" style="animation-delay:0.30000000000000004s">
      <circle cx="504" cy="116" r="30" fill="#3B82F6" opacity="0" filter="url(#blur2)"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.300;0.320;0.420;1" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="504" cy="116" r="22" fill="#0B1226" stroke="#25324A" stroke-width="2"/>
      <circle cx="504" cy="116" r="29" fill="none" stroke="#3B82F6" stroke-opacity=".35" stroke-dasharray="3 5"/>
      <circle cx="504" cy="116" r="22" fill="none" stroke="#3B82F6" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.300;0.320;0.420;1" dur="7s" repeatCount="indefinite"/></circle>
      <text x="504" y="121" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#3B82F6" text-anchor="middle">03</text>
      <text x="504" y="178" font-size="18" font-weight="700" fill="#E2E8F0" text-anchor="middle">Build</text>
      <text x="504" y="202" font-size="13" fill="#94A3B8" text-anchor="middle">component, state</text>
    </g><g class="up" style="animation-delay:0.4s">
      <circle cx="696" cy="116" r="30" fill="#818CF8" opacity="0" filter="url(#blur2)"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.460;0.480;0.580;1" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="696" cy="116" r="22" fill="#0B1226" stroke="#25324A" stroke-width="2"/>
      <circle cx="696" cy="116" r="29" fill="none" stroke="#818CF8" stroke-opacity=".35" stroke-dasharray="3 5"/>
      <circle cx="696" cy="116" r="22" fill="none" stroke="#818CF8" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.460;0.480;0.580;1" dur="7s" repeatCount="indefinite"/></circle>
      <text x="696" y="121" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#818CF8" text-anchor="middle">04</text>
      <text x="696" y="178" font-size="18" font-weight="700" fill="#E2E8F0" text-anchor="middle">Integrate</text>
      <text x="696" y="202" font-size="13" fill="#94A3B8" text-anchor="middle">API, dữ liệu</text>
    </g><g class="up" style="animation-delay:0.5s">
      <circle cx="888" cy="116" r="30" fill="#A78BFA" opacity="0" filter="url(#blur2)"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.620;0.640;0.740;1" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="888" cy="116" r="22" fill="#0B1226" stroke="#25324A" stroke-width="2"/>
      <circle cx="888" cy="116" r="29" fill="none" stroke="#A78BFA" stroke-opacity=".35" stroke-dasharray="3 5"/>
      <circle cx="888" cy="116" r="22" fill="none" stroke="#A78BFA" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.620;0.640;0.740;1" dur="7s" repeatCount="indefinite"/></circle>
      <text x="888" y="121" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#A78BFA" text-anchor="middle">05</text>
      <text x="888" y="178" font-size="18" font-weight="700" fill="#E2E8F0" text-anchor="middle">Optimize</text>
      <text x="888" y="202" font-size="13" fill="#94A3B8" text-anchor="middle">tốc độ, SEO, a11y</text>
    </g><g class="up" style="animation-delay:0.6s">
      <circle cx="1080" cy="116" r="30" fill="#34D399" opacity="0" filter="url(#blur2)"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.780;0.800;0.900;1" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="1080" cy="116" r="22" fill="#0B1226" stroke="#25324A" stroke-width="2"/>
      <circle cx="1080" cy="116" r="29" fill="none" stroke="#34D399" stroke-opacity=".35" stroke-dasharray="3 5"/>
      <circle cx="1080" cy="116" r="22" fill="none" stroke="#34D399" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.780;0.800;0.900;1" dur="7s" repeatCount="indefinite"/></circle>
      <text x="1080" y="121" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#34D399" text-anchor="middle">06</text>
      <text x="1080" y="178" font-size="18" font-weight="700" fill="#E2E8F0" text-anchor="middle">Ship</text>
      <text x="1080" y="202" font-size="13" fill="#94A3B8" text-anchor="middle">Vercel, CI</text>
