<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060A17"/><stop offset="1" stop-color="#0E1834"/></linearGradient>
  <clipPath id="round"><rect width="1200" height="260" rx="22"/></clipPath>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0 H0 V40" fill="none" stroke="#1E293B" stroke-width="1"/>
    <circle cx="0" cy="0" r="1.6" fill="#334155"/>
    <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="16s" repeatCount="indefinite"/>
  </pattern>
  <radialGradient id="fade" cx=".5" cy=".5" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="gridMask"><rect width="1200" height="260" fill="url(#fade)"/></mask>
  <linearGradient id="topline" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="pg" x1="120" x2="1080" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#3B82F6"/><stop offset="1" stop-color="#A78BFA"/></linearGradient>
  <filter id="blur2" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<style>
  .up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}</style>
<g clip-path="url(#round)">
  <rect width="1200" height="260" fill="url(#bg)"/>
  <rect width="1200" height="260" fill="url(#grid)" mask="url(#gridMask)" opacity=".75"/>
  
  
  <circle cx="600" cy="120" r="160" fill="#3B82F6" opacity="0.16" filter="url(#blur)">
    <animate attributeName="cx" values="600;600;600" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="120;120;120" dur="10s" repeatCount="indefinite"/>
  </circle>
  <rect x="44" y="30" width="3" height="18" rx="1.5" fill="#22D3EE"/>
  <text x="56" y="44" font-size="12" font-weight="700" letter-spacing="2.4" fill="#64748B">PRODUCT FLOW</text>
  <text x="1156" y="44" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="11" fill="#475569" text-anchor="end">idea → production · 6 stages</text>
  <line x1="120" y1="116" x2="1080" y2="116" stroke="#1E293B" stroke-width="3"/>
  <line x1="120" y1="116" x2="120" y2="116" stroke="url(#pg)" stroke-width="3" stroke-linecap="round">
    <animate attributeName="x2" values="120;1080;1080" keyTimes="0;0.8;1" dur="7s" repeatCount="indefinite"/>
  </line>
  <circle cx="120" cy="116" r="6" fill="#fff" filter="url(#glow)">
    <animate attributeName="cx" values="120;1080;1080" keyTimes="0;0.8;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="7s" repeatCount="indefinite"/>
  </circle>
