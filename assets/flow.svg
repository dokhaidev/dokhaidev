<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="250" viewBox="0 0 1200 250" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0A0F"/><stop offset="1" stop-color="#1B1510"/></linearGradient>
  <clipPath id="round"><rect width="1200" height="250" rx="22"/></clipPath>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="#2A2420"/>
    <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="28 28" dur="14s" repeatCount="indefinite"/>
  </pattern>
  <radialGradient id="fade" cx=".5" cy=".5" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="gridMask"><rect width="1200" height="250" fill="url(#fade)"/></mask>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  <linearGradient id="pg" x1="120" x2="1080" gradientUnits="userSpaceOnUse"><stop offset="0" stop-color="#FDE68A"/><stop offset=".5" stop-color="#F7B93E"/><stop offset="1" stop-color="#FB7185"/></linearGradient>
  <filter id="blur2" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="10"/></filter>
</defs>
<style>
  .up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}</style>
<g clip-path="url(#round)">
  <rect width="1200" height="250" fill="url(#bg)"/>
  <rect width="1200" height="250" fill="url(#dots)" mask="url(#gridMask)"/>
  
  
  <circle cx="600" cy="120" r="160" fill="#F7B93E" opacity="0.14" filter="url(#blur)">
    <animate attributeName="cx" values="600;600;600" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="120;120;120" dur="10s" repeatCount="indefinite"/>
  </circle>
  <text x="44" y="44" font-size="12" font-weight="700" letter-spacing="2.4" fill="#7C7368">PRODUCT FLOW</text>
  <line x1="120" y1="108" x2="1080" y2="108" stroke="#2A2420" stroke-width="3"/>
  <line x1="120" y1="108" x2="120" y2="108" stroke="url(#pg)" stroke-width="3" stroke-linecap="round">
    <animate attributeName="x2" values="120;1080;1080" keyTimes="0;0.8;1" dur="7s" repeatCount="indefinite"/>
  </line>
  <circle cx="120" cy="108" r="6" fill="#fff" filter="url(#glow)">
    <animate attributeName="cx" values="120;1080;1080" keyTimes="0;0.8;1" dur="7s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;1;0" keyTimes="0;0.8;1" dur="7s" repeatCount="indefinite"/>
  </circle>
  <g class="up" style="animation-delay:0.1s">
      <circle cx="120" cy="108" r="30" fill="#F7B93E" opacity="0" filter="url(#blur2)"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.1;1" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="120" cy="108" r="22" fill="#13110F" stroke="#2A2420" stroke-width="2"/>
      <circle cx="120" cy="108" r="22" fill="none" stroke="#F7B93E" stroke-width="2" opacity="0"><animate attributeName="opacity" values="1;0;0" keyTimes="0;0.1;1" dur="7s" repeatCount="indefinite"/></circle>
      <text x="120" y="113" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#F5F0E8" text-anchor="middle">01</text>
      <text x="120" y="168" font-size="18" font-weight="700" fill="#F5F0E8" text-anchor="middle">Research</text>
      <text x="120" y="192" font-size="13" fill="#B8AFA3" text-anchor="middle">hiểu người dùng</text>
    </g><g class="up" style="animation-delay:0.2s">
      <circle cx="312" cy="108" r="30" fill="#F7B93E" opacity="0" filter="url(#blur2)"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.140;0.160;0.260;1" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="312" cy="108" r="22" fill="#13110F" stroke="#2A2420" stroke-width="2"/>
      <circle cx="312" cy="108" r="22" fill="none" stroke="#F7B93E" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.140;0.160;0.260;1" dur="7s" repeatCount="indefinite"/></circle>
      <text x="312" y="113" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#F5F0E8" text-anchor="middle">02</text>
      <text x="312" y="168" font-size="18" font-weight="700" fill="#F5F0E8" text-anchor="middle">Design</text>
      <text x="312" y="192" font-size="13" fill="#B8AFA3" text-anchor="middle">Figma, wireframe</text>
    </g><g class="up" style="animation-delay:0.30000000000000004s">
      <circle cx="504" cy="108" r="30" fill="#F7B93E" opacity="0" filter="url(#blur2)"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.300;0.320;0.420;1" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="504" cy="108" r="22" fill="#13110F" stroke="#2A2420" stroke-width="2"/>
      <circle cx="504" cy="108" r="22" fill="none" stroke="#F7B93E" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.300;0.320;0.420;1" dur="7s" repeatCount="indefinite"/></circle>
      <text x="504" y="113" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#F5F0E8" text-anchor="middle">03</text>
      <text x="504" y="168" font-size="18" font-weight="700" fill="#F5F0E8" text-anchor="middle">Build</text>
      <text x="504" y="192" font-size="13" fill="#B8AFA3" text-anchor="middle">component, state</text>
    </g><g class="up" style="animation-delay:0.4s">
      <circle cx="696" cy="108" r="30" fill="#F7B93E" opacity="0" filter="url(#blur2)"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.460;0.480;0.580;1" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="696" cy="108" r="22" fill="#13110F" stroke="#2A2420" stroke-width="2"/>
      <circle cx="696" cy="108" r="22" fill="none" stroke="#F7B93E" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.460;0.480;0.580;1" dur="7s" repeatCount="indefinite"/></circle>
      <text x="696" y="113" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#F5F0E8" text-anchor="middle">04</text>
      <text x="696" y="168" font-size="18" font-weight="700" fill="#F5F0E8" text-anchor="middle">Integrate</text>
      <text x="696" y="192" font-size="13" fill="#B8AFA3" text-anchor="middle">API, dữ liệu</text>
    </g><g class="up" style="animation-delay:0.5s">
      <circle cx="888" cy="108" r="30" fill="#F7B93E" opacity="0" filter="url(#blur2)"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.620;0.640;0.740;1" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="888" cy="108" r="22" fill="#13110F" stroke="#2A2420" stroke-width="2"/>
      <circle cx="888" cy="108" r="22" fill="none" stroke="#F7B93E" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.620;0.640;0.740;1" dur="7s" repeatCount="indefinite"/></circle>
      <text x="888" y="113" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#F5F0E8" text-anchor="middle">05</text>
      <text x="888" y="168" font-size="18" font-weight="700" fill="#F5F0E8" text-anchor="middle">Optimize</text>
      <text x="888" y="192" font-size="13" fill="#B8AFA3" text-anchor="middle">tốc độ, SEO, a11y</text>
    </g><g class="up" style="animation-delay:0.6s">
      <circle cx="1080" cy="108" r="30" fill="#F7B93E" opacity="0" filter="url(#blur2)"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.780;0.800;0.900;1" dur="7s" repeatCount="indefinite"/></circle>
      <circle cx="1080" cy="108" r="22" fill="#13110F" stroke="#2A2420" stroke-width="2"/>
      <circle cx="1080" cy="108" r="22" fill="none" stroke="#F7B93E" stroke-width="2" opacity="0"><animate attributeName="opacity" values="0;0;1;0;0" keyTimes="0;0.780;0.800;0.900;1" dur="7s" repeatCount="indefinite"/></circle>
      <text x="1080" y="113" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="#F5F0E8" text-anchor="middle">06</text>
      <text x="1080" y="168" font-size="18" font-weight="700" fill="#F5F0E8" text-anchor="middle">Ship</text>
      <text x="1080" y="192" font-size="13" fill="#B8AFA3" text-anchor="middle">Vercel, CI</text>
    </g>
</g>
<rect x=".5" y=".5" width="1199" height="249" rx="22" fill="none" stroke="#2A2420"/>
</svg>
