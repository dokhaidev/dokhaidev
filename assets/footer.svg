<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060A17"/><stop offset="1" stop-color="#0E1834"/></linearGradient>
  <clipPath id="round"><rect width="1200" height="180" rx="22"/></clipPath>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0 H0 V40" fill="none" stroke="#1E293B" stroke-width="1"/>
    <circle cx="0" cy="0" r="1.6" fill="#334155"/>
    <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="16s" repeatCount="indefinite"/>
  </pattern>
  <radialGradient id="fade" cx=".5" cy=".5" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="gridMask"><rect width="1200" height="180" fill="url(#fade)"/></mask>
  <linearGradient id="topline" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  
  <linearGradient id="tg" x1="0" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
    <stop offset="0" stop-color="#22D3EE"/><stop offset=".5" stop-color="#3B82F6"/><stop offset="1" stop-color="#A78BFA"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1400 0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
</defs>
<style>
  .up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}</style>
<g clip-path="url(#round)">
  <rect width="1200" height="180" fill="url(#bg)"/>
  <rect width="1200" height="180" fill="url(#grid)" mask="url(#gridMask)" opacity=".75"/>
  
  <path d="M0 120 C300 98 600 142 900 120 S1200 98 1200 120 V180 H0Z" fill="#A78BFA" opacity="0.16"><animate attributeName="d" values="M0 120 C300 98 600 142 900 120 S1200 98 1200 120 V180 H0Z;M0 120 C300 142 600 98 900 120 S1200 142 1200 120 V180 H0Z;M0 120 C300 98 600 142 900 120 S1200 98 1200 120 V180 H0Z" dur="9s" repeatCount="indefinite"/></path><path d="M0 132 C300 114 600 150 900 132 S1200 114 1200 132 V180 H0Z" fill="#3B82F6" opacity="0.2"><animate attributeName="d" values="M0 132 C300 114 600 150 900 132 S1200 114 1200 132 V180 H0Z;M0 132 C300 150 600 114 900 132 S1200 150 1200 132 V180 H0Z;M0 132 C300 114 600 150 900 132 S1200 114 1200 132 V180 H0Z" dur="7s" repeatCount="indefinite"/></path><path d="M0 146 C300 132 600 160 900 146 S1200 132 1200 146 V180 H0Z" fill="#22D3EE" opacity="0.2"><animate attributeName="d" values="M0 146 C300 132 600 160 900 146 S1200 132 1200 146 V180 H0Z;M0 146 C300 160 600 132 900 146 S1200 160 1200 146 V180 H0Z;M0 146 C300 132 600 160 900 146 S1200 132 1200 146 V180 H0Z" dur="5s" repeatCount="indefinite"/></path>
  <path d="M24 40 V24 H40 M1160 24 H1176 V40 M24 140 V156 H40 M1160 156 H1176 V140" fill="none" stroke="#22D3EE" stroke-width="1.6" stroke-opacity="0.35" stroke-linecap="round"/>
  <text class="up" x="600" y="66" font-size="24" font-weight="700" fill="url(#tg)" text-anchor="middle">Building clean, reliable software — one commit at a time.</text>
  <text class="up" style="animation-delay:.25s" x="600" y="96" font-size="14" fill="#94A3B8" text-anchor="middle" letter-spacing="1.2">RICHARD HUYNH · SOFTWARE ENGINEER · VIỆT NAM</text>
  <text class="up" style="animation-delay:.4s" x="600" y="120" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="12" fill="#64748B" text-anchor="middle">dookei.dev  ·  github.com/dokhaidev</text>
  <rect x="180" y="0" width="840" height="1.5" fill="url(#topline)" opacity=".8"/>
</g>
<rect x=".5" y=".5" width="1199" height="179" rx="22" fill="none" stroke="#1E293B"/>
</svg>
