<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="170" viewBox="0 0 1200 170" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0A0F"/><stop offset="1" stop-color="#1B1510"/></linearGradient>
  <clipPath id="round"><rect width="1200" height="170" rx="22"/></clipPath>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="#2A2420"/>
    <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="28 28" dur="14s" repeatCount="indefinite"/>
  </pattern>
  <radialGradient id="fade" cx=".5" cy=".5" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="gridMask"><rect width="1200" height="170" fill="url(#fade)"/></mask>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  
  <linearGradient id="tg" x1="0" y1="0" x2="700" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
    <stop offset="0" stop-color="#FDE68A"/><stop offset=".5" stop-color="#F7B93E"/><stop offset="1" stop-color="#FB7185"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1400 0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
</defs>
<style>
  .up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}</style>
<g clip-path="url(#round)">
  <rect width="1200" height="170" fill="url(#bg)"/>
  <rect width="1200" height="170" fill="url(#dots)" mask="url(#gridMask)"/>
  
  <path d="M0 110 C300 88 600 132 900 110 S1200 88 1200 110 V170 H0Z" fill="#FB7185" opacity="0.16"><animate attributeName="d" values="M0 110 C300 88 600 132 900 110 S1200 88 1200 110 V170 H0Z;M0 110 C300 132 600 88 900 110 S1200 132 1200 110 V170 H0Z;M0 110 C300 88 600 132 900 110 S1200 88 1200 110 V170 H0Z" dur="9s" repeatCount="indefinite"/></path><path d="M0 122 C300 104 600 140 900 122 S1200 104 1200 122 V170 H0Z" fill="#FB923C" opacity="0.18"><animate attributeName="d" values="M0 122 C300 104 600 140 900 122 S1200 104 1200 122 V170 H0Z;M0 122 C300 140 600 104 900 122 S1200 140 1200 122 V170 H0Z;M0 122 C300 104 600 140 900 122 S1200 104 1200 122 V170 H0Z" dur="7s" repeatCount="indefinite"/></path><path d="M0 136 C300 122 600 150 900 136 S1200 122 1200 136 V170 H0Z" fill="#F7B93E" opacity="0.22"><animate attributeName="d" values="M0 136 C300 122 600 150 900 136 S1200 122 1200 136 V170 H0Z;M0 136 C300 150 600 122 900 136 S1200 150 1200 136 V170 H0Z;M0 136 C300 122 600 150 900 136 S1200 122 1200 136 V170 H0Z" dur="5s" repeatCount="indefinite"/></path>
  <text class="up" x="600" y="62" font-size="24" font-weight="700" fill="url(#tg)" text-anchor="middle">Building clean, reliable software — one commit at a time.</text>
  <text class="up" style="animation-delay:.25s" x="600" y="92" font-size="14" fill="#B8AFA3" text-anchor="middle" letter-spacing="1.2">RICHARD HUYNH · SOFTWARE ENGINEER · VIỆT NAM</text>
</g>
<rect x=".5" y=".5" width="1199" height="169" rx="22" fill="none" stroke="#2A2420"/>
</svg>
