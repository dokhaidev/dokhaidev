<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="92" viewBox="0 0 1200 92" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <linearGradient id="hg" x1="0" y1="0" x2="400" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
    <stop offset="0" stop-color="#FDE68A"/><stop offset=".5" stop-color="#F7B93E"/><stop offset="1" stop-color="#FB7185"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="800 0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
  <linearGradient id="hb" x1="0" x2="1"><stop offset="0" stop-color="#0B0A0F"/><stop offset="1" stop-color="#1B1510"/></linearGradient>
  <linearGradient id="ln" x1="0" x2="1"><stop offset="0" stop-color="#F7B93E" stop-opacity="0"/><stop offset=".5" stop-color="#F7B93E"/><stop offset="1" stop-color="#FB7185" stop-opacity="0"/></linearGradient>
  <clipPath id="r"><rect width="1200" height="92" rx="16"/></clipPath>
</defs>
<style>.up{animation:up .8s ease both}@keyframes up{from{opacity:0;transform:translateX(-12px)}to{opacity:1;transform:none}}</style>
<g clip-path="url(#r)">
<rect width="1200" height="92" fill="url(#hb)"/>
<rect x="0" y="0" width="5" height="92" fill="url(#hg)"/>
<g class="up"><rect x="30" y="24" width="46" height="30" rx="8" fill="#13110F" stroke="#2A2420"/>
<text x="53" y="44" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="14" font-weight="700" fill="url(#hg)" text-anchor="middle">02</text>
<text x="96" y="47" font-size="26" font-weight="800" fill="#F5F0E8" letter-spacing="-.4">Tech Stack</text>
<text x="96" y="72" font-size="14" fill="#B8AFA3">Công cụ mình dùng hằng ngày để đưa sản phẩm lên production</text></g>
<rect x="-300" y="90" width="300" height="2" fill="url(#ln)"><animate attributeName="x" from="-300" to="1200" dur="4s" repeatCount="indefinite"/></rect>
</g>
<rect x=".5" y=".5" width="1199" height="91" rx="16" fill="none" stroke="#2A2420"/>
</svg>
