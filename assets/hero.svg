<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B0A0F"/><stop offset="1" stop-color="#1B1510"/></linearGradient>
  <clipPath id="round"><rect width="1200" height="420" rx="22"/></clipPath>
  <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse">
    <circle cx="2" cy="2" r="1.2" fill="#2A2420"/>
    <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="28 28" dur="14s" repeatCount="indefinite"/>
  </pattern>
  <radialGradient id="fade" cx=".5" cy=".5" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".95"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="gridMask"><rect width="1200" height="420" fill="url(#fade)"/></mask>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  
  <linearGradient id="tg" x1="0" y1="0" x2="640" y2="0" gradientUnits="userSpaceOnUse" spreadMethod="reflect">
    <stop offset="0" stop-color="#FDE68A"/><stop offset=".5" stop-color="#F7B93E"/><stop offset="1" stop-color="#FB7185"/>
    <animateTransform attributeName="gradientTransform" type="translate" from="0 0" to="1280 0" dur="8s" repeatCount="indefinite"/>
  </linearGradient>
</defs>
<style>
  .up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
  .blink{animation:blink 1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}</style>
<g clip-path="url(#round)">
  <rect width="1200" height="420" fill="url(#bg)"/>
  <rect width="1200" height="420" fill="url(#dots)" mask="url(#gridMask)"/>
  
  
  <circle cx="1000" cy="90" r="170" fill="#F7B93E" opacity="0.22" filter="url(#blur)">
    <animate attributeName="cx" values="1000;920;1000" dur="14s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;140;90" dur="14s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="180" cy="380" r="190" fill="#FB7185" opacity="0.18" filter="url(#blur)">
    <animate attributeName="cx" values="180;270;180" dur="18s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="380;340;380" dur="18s" repeatCount="indefinite"/>
  </circle>
  
  <circle cx="640" cy="400" r="120" fill="#FB923C" opacity="0.18" filter="url(#blur)">
    <animate attributeName="cx" values="640;580;640" dur="16s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="400;370;400" dur="16s" repeatCount="indefinite"/>
  </circle>

  <g class="up" style="animation-delay:.1s">
    <rect x="70" y="66" width="330" height="32" rx="16" fill="#13110F" stroke="#2A2420"/>
    <circle cx="92" cy="82" r="5" fill="#2DD4BF"/>
    <circle cx="92" cy="82" r="5" fill="none" stroke="#2DD4BF" stroke-width="2">
      <animate attributeName="r" values="5;12" dur="1.6s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="1;0" dur="1.6s" repeatCount="indefinite"/>
    </circle>
    <text x="108" y="87" font-size="13" font-weight="600" letter-spacing="1.6" fill="#B8AFA3">SOFTWARE ENGINEER · VIỆT NAM</text>
  </g>

  <text class="up" style="animation-delay:.3s" x="66" y="176" font-size="72" font-weight="800" letter-spacing="-2" fill="url(#tg)">Richard Huynh</text>
  <text class="up" style="animation-delay:.45s" x="70" y="212" font-size="18" fill="#7C7368">Huỳnh Phan Đỗ Khải  ·  <tspan font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace">@dokhaidev</tspan></text>

  <text class="up" style="animation-delay:.6s" x="70" y="262" font-size="30" font-weight="600" fill="#F5F0E8">Software Engineer · Web Developer</text>
  <text class="up" style="animation-delay:.75s" x="70" y="296" font-size="18" fill="#B8AFA3">React · Next.js · TypeScript · UI/UX — from pixel to production</text>

  <g class="up" style="animation-delay:.9s">
    <rect x="70" y="326" width="520" height="46" rx="10" fill="#08070A" stroke="#2A2420"/>
    <circle cx="92" cy="349" r="5" fill="#F87171"/><circle cx="110" cy="349" r="5" fill="#FBBF24"/><circle cx="128" cy="349" r="5" fill="#34D399"/>
    <clipPath id="type"><rect x="150" y="331" width="0" height="36">
      <animate attributeName="width" values="0;0;420;420;0" keyTimes="0;.12;.55;.92;1" dur="7s" repeatCount="indefinite"/>
    </rect></clipPath>
    <text clip-path="url(#type)" x="152" y="355" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="16" fill="#F7B93E">$ npm run build &amp;&amp; deploy<tspan fill="#34D399">  ✓ live</tspan></text>
  </g>
  
    <g class="up" style="animation-delay:.5s">
      <rect x="720" y="70" width="420" height="290" rx="14" fill="#13110F" stroke="#2A2420"/>
      <path d="M720 84 a14 14 0 0 1 14 -14 h392 a14 14 0 0 1 14 14 v20 h-420 z" fill="#1A1714"/>
      <circle cx="740" cy="87" r="5" fill="#F87171"/><circle cx="758" cy="87" r="5" fill="#FBBF24"/><circle cx="776" cy="87" r="5" fill="#34D399"/>
      <rect x="804" y="79" width="250" height="16" rx="8" fill="#0B0A0F"/>
      <text x="816" y="91" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="10" fill="#7C7368">dookei.dev</text>
      <rect x="740" y="120" width="110" height="12" rx="6" fill="#F7B93E" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.05;0.110;.92;1" dur="8s" repeatCount="indefinite"/></rect>
      <rect x="1020" y="120" width="100" height="12" rx="6" fill="#2A2420" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.08;0.140;.92;1" dur="8s" repeatCount="indefinite"/></rect>
      <rect x="740" y="152" width="240" height="22" rx="6" fill="#F5F0E8" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.14;0.200;.92;1" dur="8s" repeatCount="indefinite"/></rect>
      <rect x="740" y="182" width="190" height="10" rx="6" fill="#7C7368" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.2;0.260;.92;1" dur="8s" repeatCount="indefinite"/></rect>
      <rect x="740" y="200" width="210" height="10" rx="6" fill="#7C7368" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.24;0.300;.92;1" dur="8s" repeatCount="indefinite"/></rect>
      <rect x="740" y="222" width="96" height="28" rx="14" fill="#F7B93E" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.3;0.360;.92;1" dur="8s" repeatCount="indefinite"/></rect>
      <rect x="844" y="222" width="96" height="28" rx="14" fill="#2A2420" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.33;0.390;.92;1" dur="8s" repeatCount="indefinite"/></rect>
      <rect x="1000" y="150" width="120" height="100" rx="12" fill="#2A1F14" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.38;0.440;.92;1" dur="8s" repeatCount="indefinite"/></rect>
      <rect x="740" y="270" width="120" height="70" rx="10" fill="#1F1A15" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.46;0.520;.92;1" dur="8s" repeatCount="indefinite"/></rect>
      <rect x="870" y="270" width="120" height="70" rx="10" fill="#1F1A15" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.52;0.580;.92;1" dur="8s" repeatCount="indefinite"/></rect>
      <rect x="1000" y="270" width="120" height="70" rx="10" fill="#1F1A15" opacity="0">
      <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;0.58;0.640;.92;1" dur="8s" repeatCount="indefinite"/></rect>
      <circle cx="1060" cy="200" r="26" fill="none" stroke="#F7B93E" stroke-width="3" stroke-dasharray="120 200" opacity="0">
        <animate attributeName="opacity" values="0;0;1;1;0" keyTimes="0;.42;.48;.92;1" dur="8s" repeatCount="indefinite"/>
        <animateTransform attributeName="transform" type="rotate" from="0 1060 200" to="360 1060 200" dur="3s" repeatCount="indefinite"/>
      </circle>
      <g>
        <path d="M0 0 L0 16 L4.5 12 L8 19 L10.5 18 L7 11 L13 11 Z" fill="#fff" stroke="#000" stroke-width="1"/>
        <animateTransform attributeName="transform" type="translate" values="1100 330;780 235;780 235;1060 305;1100 330" keyTimes="0;.3;.4;.75;1" dur="8s" repeatCount="indefinite"/>
      </g>
    </g>
    <g class="up" style="animation-delay:1.1s"><g>
      <rect x="680" y="290" width="150" height="46" rx="12" fill="#13110F" stroke="#F7B93E" stroke-opacity=".6"/>
      <text x="698" y="310" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="11" fill="#7C7368">Lighthouse</text>
      <text x="698" y="327" font-size="14" font-weight="700" fill="#F7B93E">Perf · A11y · SEO</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 -6;0 0" dur="4s" repeatCount="indefinite" additive="sum"/>
    </g></g>
    <g class="up" style="animation-delay:1.3s"><g>
      <rect x="1050" y="46" width="130" height="40" rx="12" fill="#13110F" stroke="#2DD4BF" stroke-opacity=".6"/>
      <circle cx="1070" cy="66" r="5" fill="#2DD4BF"><animate attributeName="opacity" values="1;.3;1" dur="1.6s" repeatCount="indefinite"/></circle>
      <text x="1082" y="71" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="12" font-weight="700" fill="#F5F0E8">deployed</text>
      <animateTransform attributeName="transform" type="translate" values="0 0;0 6;0 0" dur="5s" repeatCount="indefinite" additive="sum"/>
