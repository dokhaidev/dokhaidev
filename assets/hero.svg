  </linearGradient>
  <linearGradient id="beam" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE" stop-opacity=".07"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
</defs>
