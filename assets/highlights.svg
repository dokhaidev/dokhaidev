<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="180" viewBox="0 0 1200 180" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#060A17"/><stop offset="1" stop-color="#0E1834"/></linearGradient>
  <clipPath id="round"><rect width="1200" height="180" rx="18"/></clipPath>
  <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
    <path d="M40 0 H0 V40" fill="none" stroke="#1E293B" stroke-width="1"/>
    <circle cx="0" cy="0" r="1.6" fill="#334155"/>
    <animateTransform attributeName="patternTransform" type="translate" from="0 0" to="40 40" dur="16s" repeatCount="indefinite"/>
  </pattern>
  <radialGradient id="fade" cx=".5" cy=".5" r=".75"><stop offset="0" stop-color="#fff" stop-opacity=".9"/><stop offset="1" stop-color="#fff" stop-opacity="0"/></radialGradient>
  <mask id="gridMask"><rect width="1200" height="180" fill="url(#fade)"/></mask>
  <linearGradient id="topline" x1="0" x2="1"><stop offset="0" stop-color="#22D3EE" stop-opacity="0"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#A78BFA" stop-opacity="0"/></linearGradient>
  <filter id="blur" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="60"/></filter>
  <filter id="glow" x="-50%" y="-50%" width="200%" height="200%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  
</defs>
<style>
  .up{animation:up .9s cubic-bezier(.2,.7,.2,1) both}
  @keyframes up{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}</style>
<g clip-path="url(#round)">
  <rect width="1200" height="180" fill="url(#bg)"/>
  <rect width="1200" height="180" fill="url(#grid)" mask="url(#gridMask)" opacity=".75"/>
  
  <circle cx="600" cy="90" r="180" fill="#3B82F6" opacity="0.16" filter="url(#blur)">
    <animate attributeName="cx" values="600;600;600" dur="10s" repeatCount="indefinite"/>
    <animate attributeName="cy" values="90;90;90" dur="10s" repeatCount="indefinite"/>
  </circle><g class="up" style="animation-delay:0.1s">
      <rect x="45" y="30" width="255" height="120" rx="14" fill="#0B1226" fill-opacity=".9" stroke="#1E293B"/>
      <rect x="45" y="48" width="3" height="34" rx="1.5" fill="#22D3EE"/>
      <path d="M51 44 V36 H59 M286 36 H294 V44 M51 136 V144 H59 M286 144 H294 V136" fill="none" stroke="#22D3EE" stroke-width="1.6" stroke-opacity="0.5" stroke-linecap="round"/>
      <text x="67" y="82" font-size="34" font-weight="800" fill="#E2E8F0" letter-spacing="-1">20+</text>
      <text x="67" y="106" font-size="14" font-weight="700" fill="#22D3EE">Public repositories</text>
      <text x="67" y="125" font-size="12" fill="#64748B">on GitHub</text>
      <rect x="67" y="136" width="211" height="3" rx="1.5" fill="#1E293B"/>
      <rect x="67" y="136" width="0" height="3" rx="1.5" fill="#22D3EE">
        <animate attributeName="width" from="0" to="173" begin="0.40s" dur="1.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .7 .2 1"/>
      </rect>
      <circle cx="276" cy="54" r="3.5" fill="#22D3EE"/>
  <circle cx="276" cy="54" r="3.5" fill="none" stroke="#22D3EE" stroke-width="2">
    <animate attributeName="r" values="3.5;10.5" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="1.6s" repeatCount="indefinite"/>
  </circle>
    </g><g class="up" style="animation-delay:0.22s">
      <rect x="320" y="30" width="255" height="120" rx="14" fill="#0B1226" fill-opacity=".9" stroke="#1E293B"/>
