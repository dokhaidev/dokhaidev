      <path d="M326 44 V36 H334 M561 36 H569 V44 M326 136 V144 H334 M561 144 H569 V136" fill="none" stroke="#3B82F6" stroke-width="1.6" stroke-opacity="0.5" stroke-linecap="round"/>
      <text x="342" y="82" font-size="34" font-weight="800" fill="#E2E8F0" letter-spacing="-1">6</text>
      <text x="342" y="106" font-size="14" font-weight="700" fill="#3B82F6">Featured products</text>
      <text x="342" y="125" font-size="12" fill="#64748B">live on Vercel</text>
      <rect x="342" y="136" width="211" height="3" rx="1.5" fill="#1E293B"/>
      <rect x="342" y="136" width="0" height="3" rx="1.5" fill="#3B82F6">
        <animate attributeName="width" from="0" to="135" begin="0.55s" dur="1.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .7 .2 1"/>
      </rect>
      <circle cx="551" cy="54" r="3.5" fill="#3B82F6"/>
  <circle cx="551" cy="54" r="3.5" fill="none" stroke="#3B82F6" stroke-width="2">
    <animate attributeName="r" values="3.5;10.5" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="1.6s" repeatCount="indefinite"/>
  </circle>
    </g><g class="up" style="animation-delay:0.33999999999999997s">
      <rect x="595" y="30" width="255" height="120" rx="14" fill="#0B1226" fill-opacity=".9" stroke="#1E293B"/>
      <rect x="595" y="48" width="3" height="34" rx="1.5" fill="#A78BFA"/>
      <path d="M601 44 V36 H609 M836 36 H844 V44 M601 136 V144 H609 M836 144 H844 V136" fill="none" stroke="#A78BFA" stroke-width="1.6" stroke-opacity="0.5" stroke-linecap="round"/>
      <text x="617" y="82" font-size="34" font-weight="800" fill="#E2E8F0" letter-spacing="-1">15+</text>
      <text x="617" y="106" font-size="14" font-weight="700" fill="#A78BFA">Technologies</text>
      <text x="617" y="125" font-size="12" fill="#64748B">frontend → backend</text>
      <rect x="617" y="136" width="211" height="3" rx="1.5" fill="#1E293B"/>
      <rect x="617" y="136" width="0" height="3" rx="1.5" fill="#A78BFA">
        <animate attributeName="width" from="0" to="156" begin="0.70s" dur="1.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .7 .2 1"/>
      </rect>
      <circle cx="826" cy="54" r="3.5" fill="#A78BFA"/>
  <circle cx="826" cy="54" r="3.5" fill="none" stroke="#A78BFA" stroke-width="2">
    <animate attributeName="r" values="3.5;10.5" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="1.6s" repeatCount="indefinite"/>
  </circle>
    </g><g class="up" style="animation-delay:0.45999999999999996s">
      <rect x="870" y="30" width="255" height="120" rx="14" fill="#0B1226" fill-opacity=".9" stroke="#1E293B"/>
      <rect x="870" y="48" width="3" height="34" rx="1.5" fill="#34D399"/>
      <path d="M876 44 V36 H884 M1111 36 H1119 V44 M876 136 V144 H884 M1111 144 H1119 V136" fill="none" stroke="#34D399" stroke-width="1.6" stroke-opacity="0.5" stroke-linecap="round"/>
      <text x="892" y="82" font-size="34" font-weight="800" fill="#E2E8F0" letter-spacing="-1">SMAC</text>
      <text x="892" y="106" font-size="14" font-weight="700" fill="#34D399">Technology</text>
      <text x="892" y="125" font-size="12" fill="#64748B">Software Engineer · current</text>
      <rect x="892" y="136" width="211" height="3" rx="1.5" fill="#1E293B"/>
      <rect x="892" y="136" width="0" height="3" rx="1.5" fill="#34D399">
        <animate attributeName="width" from="0" to="211" begin="0.85s" dur="1.6s" fill="freeze" calcMode="spline" keyTimes="0;1" keySplines=".2 .7 .2 1"/>
      </rect>
      <circle cx="1101" cy="54" r="3.5" fill="#34D399"/>
  <circle cx="1101" cy="54" r="3.5" fill="none" stroke="#34D399" stroke-width="2">
    <animate attributeName="r" values="3.5;10.5" dur="1.6s" repeatCount="indefinite"/>
    <animate attributeName="opacity" values="1;0" dur="1.6s" repeatCount="indefinite"/>
  </circle>
    </g>
  <rect x="180" y="0" width="840" height="1.5" fill="url(#topline)" opacity=".8"/>
</g>
<rect x=".5" y=".5" width="1199" height="179" rx="18" fill="none" stroke="#1E293B"/>
</svg>
