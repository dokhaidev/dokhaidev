<svg xmlns="http://www.w3.org/2000/svg" width="580" height="190" viewBox="0 0 580 190" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <clipPath id="clip"><rect width="580" height="190" rx="10"/></clipPath>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#21262D"/></pattern>
  
</defs>
<style>
  .in{animation:in .7s ease-out both}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .soft{animation:soft 2.4s ease-in-out infinite}
  @keyframes soft{50%{opacity:.35}}</style>
<g clip-path="url(#clip)">
  <rect width="580" height="190" fill="#0D1117"/>
  
    <g class="in" style="animation-delay:0.13s">
      <text x="32" y="46" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="12" fill="#484F58">04</text>
      <circle cx="488" cy="42" r="3.5" fill="#3FB950"/>
      <text x="498" y="46.5" font-size="12.5" fill="#8B949E">Live demo</text>
      <text x="32" y="92" font-size="22" font-weight="600" fill="#E6EDF3" letter-spacing="-.3">Quiz App</text>
      <text x="32" y="122" font-size="14.5" fill="#8B949E">An interactive quiz app with real-time scoring.</text>
      <line x1="32" y1="146" x2="548" y2="146" stroke="#21262D"/>
      <text x="32" y="172" font-family="ui-monospace, SFMono-Regular, 'Cascadia Code', Menlo, Consolas, monospace" font-size="12.5" fill="#6E7681">Next.js · TypeScript</text>
      <text x="548" y="173" font-size="16" fill="#58A6FF" text-anchor="end">↗</text>
    </g>
</g>
<rect x=".5" y=".5" width="579" height="189" rx="10" fill="none" stroke="#21262D"/>
</svg>
