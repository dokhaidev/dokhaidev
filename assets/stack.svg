<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, sans-serif">
<defs>
  <clipPath id="clip"><rect width="1200" height="300" rx="12"/></clipPath>
  <pattern id="dots" width="22" height="22" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="1" fill="#21262D"/></pattern>
  
</defs>
<style>
  .in{animation:in .7s ease-out both}
  @keyframes in{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
  .blink{animation:blink 1.1s steps(1) infinite}
  @keyframes blink{50%{opacity:0}}
  .soft{animation:soft 2.4s ease-in-out infinite}
  @keyframes soft{50%{opacity:.35}}</style>
<g clip-path="url(#clip)">
  <rect width="1200" height="300" fill="#0D1117"/>
  
    <g class="in" style="animation-delay:0.1s">
      <text x="36" y="35" font-size="14" font-weight="600" fill="#8B949E">Languages</text>
      <rect x="240" y="15" width="109" height="30" rx="6" fill="#111722" stroke="#30363D"/>
        <text x="294.5" y="35" font-size="14" fill="#C9D1D9" text-anchor="middle">JavaScript</text><rect x="359" y="15" width="109" height="30" rx="6" fill="#111722" stroke="#30363D"/>
        <text x="413.5" y="35" font-size="14" fill="#C9D1D9" text-anchor="middle">TypeScript</text><rect x="478" y="15" width="69" height="30" rx="6" fill="#111722" stroke="#30363D"/>
        <text x="512.5" y="35" font-size="14" fill="#C9D1D9" text-anchor="middle">HTML5</text><rect x="557" y="15" width="60" height="30" rx="6" fill="#111722" stroke="#30363D"/>
        <text x="587" y="35" font-size="14" fill="#C9D1D9" text-anchor="middle">CSS3</text>
    </g><line x1="32" y1="60" x2="1168" y2="60" stroke="#21262D"/>
    <g class="in" style="animation-delay:0.17s">
      <text x="36" y="95" font-size="14" font-weight="600" fill="#8B949E">Frontend</text>
      <rect x="240" y="75" width="69" height="30" rx="6" fill="#111722" stroke="#30363D"/>
        <text x="274.5" y="95" font-size="14" fill="#C9D1D9" text-anchor="middle">React</text><rect x="319" y="75" width="85" height="30" rx="6" fill="#111722" stroke="#30363D"/>
        <text x="361.5" y="95" font-size="14" fill="#C9D1D9" text-anchor="middle">Next.js</text><rect x="414" y="75" width="69" height="30" rx="6" fill="#111722" stroke="#30363D"/>
        <text x="448.5" y="95" font-size="14" fill="#C9D1D9" text-anchor="middle">Redux</text><rect x="493" y="75" width="125" height="30" rx="6" fill="#111722" stroke="#30363D"/>
        <text x="555.5" y="95" font-size="14" fill="#C9D1D9" text-anchor="middle">Tailwind CSS</text>
    </g><line x1="32" y1="120" x2="1168" y2="120" stroke="#21262D"/>
    <g class="in" style="animation-delay:0.24000000000000002s">
      <text x="36" y="155" font-size="14" font-weight="600" fill="#8B949E">Backend</text>
      <rect x="240" y="135" width="85" height="30" rx="6" fill="#111722" stroke="#30363D"/>
        <text x="282.5" y="155" font-size="14" fill="#C9D1D9" text-anchor="middle">Node.js</text><rect x="335" y="135" width="85" height="30" rx="6" fill="#111722" stroke="#30363D"/>
        <text x="377.5" y="155" font-size="14" fill="#C9D1D9" text-anchor="middle">Express</text><rect x="430" y="135" width="93" height="30" rx="6" fill="#111722" stroke="#30363D"/>
        <text x="476.5" y="155" font-size="14" fill="#C9D1D9" text-anchor="middle">REST API</text>
    </g><line x1="32" y1="180" x2="1168" y2="180" stroke="#21262D"/>
    <g class="in" style="animation-delay:0.31000000000000005s">
      <text x="36" y="215" font-size="14" font-weight="600" fill="#8B949E">Database</text>
      <rect x="240" y="195" width="85" height="30" rx="6" fill="#111722" stroke="#30363D"/>
        <text x="282.5" y="215" font-size="14" fill="#C9D1D9" text-anchor="middle">MongoDB</text>
    </g><line x1="32" y1="240" x2="1168" y2="240" stroke="#21262D"/>
    <g class="in" style="animation-delay:0.38s">
      <text x="36" y="275" font-size="14" font-weight="600" fill="#8B949E">Tools &amp; Design</text>
      <rect x="240" y="255" width="52" height="30" rx="6" fill="#111722" stroke="#30363D"/>
        <text x="266" y="275" font-size="14" fill="#C9D1D9" text-anchor="middle">Git</text><rect x="302" y="255" width="77" height="30" rx="6" fill="#111722" stroke="#30363D"/>
        <text x="340.5" y="275" font-size="14" fill="#C9D1D9" text-anchor="middle">GitHub</text><rect x="389" y="255" width="69" height="30" rx="6" fill="#111722" stroke="#30363D"/>
        <text x="423.5" y="275" font-size="14" fill="#C9D1D9" text-anchor="middle">Figma</text><rect x="468" y="255" width="85" height="30" rx="6" fill="#111722" stroke="#30363D"/>
        <text x="510.5" y="275" font-size="14" fill="#C9D1D9" text-anchor="middle">VS Code</text><rect x="563" y="255" width="77" height="30" rx="6" fill="#111722" stroke="#30363D"/>
        <text x="601.5" y="275" font-size="14" fill="#C9D1D9" text-anchor="middle">Vercel</text>
    </g>
</g>
<rect x=".5" y=".5" width="1199" height="299" rx="12" fill="none" stroke="#21262D"/>
</svg>
